[package]
name = "goulash-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Engine characterization harness — drives goulash's real prompt builder, providers and answer parser"

[dependencies]
goulash = { path = ".." }
libc = "0.2.187"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = { version = "2", default-features = false }
