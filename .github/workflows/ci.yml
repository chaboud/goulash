name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build
      - name: Terminal screen model (for rendering assertions)
        # An under-erase is bytes that were never sent, so a byte-stream
        # assertion cannot see it. pyte renders the stream so the tests
        # can compare screens. Optional: e2e skips those checks without
        # it rather than failing.
        run: python3 -m pip install --quiet --break-system-packages pyte || true
      - name: End-to-end tests (PTY)
        run: python3 tests/e2e.py
