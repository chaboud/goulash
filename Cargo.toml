[package]
name = "goulash"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Matthew Chaboud"]
description = "Your shell, with a coach — an LLM overlay that wraps zsh/bash, watches the session, and offers answers and pullable command suggestions"
repository = "https://github.com/chaboud/goulash"
homepage = "https://goulash.dev"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shell", "terminal", "pty", "llm", "assistant"]
categories = ["command-line-utilities"]
# docs/ holds a 6.4 MB demo GIF. crates.io cannot render a relative
# image path anyway, so shipping it made every `cargo install` pay for a
# file nobody could see — the README points at the raw GitHub URL.
exclude = ["wiki/", "tests/", ".github/", "Formula/", "scripts/", "bench/", "docs/"]

# The characterization harness. Kept out of the published package and out
# of goulash's dependency tree, but built against the real lib so it
# exercises the shipped prompt builder, wire formats and answer parser.
[workspace]
members = ["bench"]

[dependencies]
base64 = "0.22.1"
libc = "0.2.187"
nix = { version = "0.31.3", features = ["term", "process", "signal", "fs", "poll"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
toml_edit = "0.25.13"
ureq = { version = "2", default-features = false }
vt100 = "0.16.2"
