[package]
name = "goulash"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Matthew Chaboud"]
description = "Your shell, with a coach — an LLM overlay that wraps zsh/bash, watches the session, and offers answers and pullable command suggestions"
repository = "https://github.com/chaboud/goulash"
homepage = "https://goulash.dev"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shell", "terminal", "pty", "llm", "assistant"]
categories = ["command-line-utilities"]
exclude = ["wiki/", "tests/", ".github/", "Formula/", "scripts/"]

[dependencies]
base64 = "0.22.1"
libc = "0.2.187"
nix = { version = "0.31.3", features = ["term", "process", "signal", "fs", "poll"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
toml_edit = "0.25.13"
ureq = { version = "2", default-features = false }
vt100 = "0.16.2"
